name: Import macOS signing source

on:
  workflow_dispatch:
    inputs:
      product:
        description: Fixed macOS product asset
        required: true
        type: choice
        options:
          - iris-arm64
          - iris-x64
          - epilogue-arm64

permissions:
  contents: read

jobs:
  import:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      INPUT_PRODUCT: ${{ inputs.product }}
    steps:
      - name: Reject workflow reruns
        if: ${{ github.run_attempt != 1 }}
        run: exit 1

      - name: Checkout exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verify and prepare fixed release asset
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/import-macos.mjs prepare

      - name: Upload unsigned signing inputs
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-macos-${{ inputs.product }}
          path: |
            ${{ steps.prepare.outputs.output_dir }}/unsigned.tar.gz
            ${{ steps.prepare.outputs.output_dir }}/template.dmg
            ${{ steps.prepare.outputs.output_dir }}/source.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Register signing request
        env:
          SIGNING_API_KEY: ${{ secrets.SIGNING_API_KEY }}
          INPUT_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          INPUT_VERSION: ${{ steps.prepare.outputs.version }}
          INPUT_SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
          INPUT_WORK_DIR: ${{ steps.prepare.outputs.work_dir }}
        run: node scripts/import-macos.mjs submit

      - name: Clean up this import
        if: always() && steps.prepare.outputs.work_dir != ''
        env:
          INPUT_WORK_DIR: ${{ steps.prepare.outputs.work_dir }}
        run: node scripts/import-macos.mjs cleanup
