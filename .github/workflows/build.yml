name: Build IRIS

on:
  repository_dispatch:
    types: [iris-build]
  workflow_dispatch:
    inputs:
      kind:
        description: Build operation
        required: true
        type: choice
        options: [core, shell]
      source_sha:
        description: Exact 40-character commit in lsy-404/IRIS
        required: true
        type: string
      shell_version:
        description: Optional shell version (x.y.z)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: iris-build
  cancel-in-progress: false

env:
  IRIS_SOURCE_SHA: ${{ github.event.client_payload.source_sha || inputs.source_sha }}
  IRIS_LICENSE_API_URL: https://iris.voidcarve.com
  IRIS_LICENSE_BUILD_API_ORIGIN: https://iris.voidcarve.com
  WORKFLOW_REPORT_API: https://iris.voidcarve.com/api/v1/internal/workflow-reports

defaults:
  run:
    shell: bash

jobs:
  release-gate:
    if: github.run_attempt == 1 && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.gate.outputs.build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check pending shell publication
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .release-tools/scripts/publish-shell.mjs gate

  core:
    timeout-minutes: 60
    needs: [release-gate, notification-readers]
    permissions:
      actions: read
      contents: write
    if: needs.release-gate.outputs.build == 'true' && ((github.event_name == 'repository_dispatch' && github.event.action == 'iris-build' && github.event.client_payload.build_kind == 'core') || (github.event_name == 'workflow_dispatch' && inputs.kind == 'core'))
    runs-on: ubuntu-latest
    outputs:
      core_version: ${{ steps.number.outputs.core_version }}
    steps:
      - name: Checkout build repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate inputs and secrets
        env:
          IRIS_BUILD_DEPLOY_KEY: ${{ secrets.IRIS_BUILD_DEPLOY_KEY }}
          IRIS_TAG_DEPLOY_KEY: ${{ secrets.IRIS_TAG_DEPLOY_KEY }}
          IRIS_RELEASE_UPLOAD_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
        run: |
          [[ "$IRIS_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'source_sha must be a 40-character commit SHA' >&2; exit 1; }
          [[ -n "$IRIS_BUILD_DEPLOY_KEY" && -n "$IRIS_TAG_DEPLOY_KEY" && -n "$IRIS_RELEASE_UPLOAD_TOKEN" ]] || { echo 'required secrets are missing' >&2; exit 1; }
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: Checkout exact private source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: lsy-404/IRIS
          ref: ${{ env.IRIS_SOURCE_SHA }}
          path: iris-source
          ssh-key: ${{ secrets.IRIS_BUILD_DEPLOY_KEY }}
          persist-credentials: false
      - name: Use source scripts
        run: |
          shopt -s dotglob nullglob
          for entry in iris-source/*; do
            [[ "$entry" == "iris-source/.git" ]] && continue
            cp -R "$entry" ./
          done
      - name: Install pnpm
        run: |
          npm install --global --force corepack@0.34.1
          corepack enable pnpm
          corepack prepare pnpm@10.34.6 --activate
      - name: Install dependencies
        env:
          IRIS_RELEASE_UPLOAD_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
          WORKFLOW_REPORT_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
          IRIS_SHELL_VERDICT_FILE: ${{ runner.temp }}/shell-gate-verdict
          IRIS_SHELL_GATE_OUTCOME: success
          IRIS_BUILD_CHANNEL: release
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh install
      - name: Read build metadata
        id: meta
        env:
          IRIS_RELEASE_UPLOAD_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
          WORKFLOW_REPORT_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
        run: node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh metadata
      - name: Resolve current release
        env:
          IRIS_RELEASE_UPLOAD_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
          WORKFLOW_REPORT_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
        run: node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh fetch-release-identity
      - name: Verify released shell compatibility
        id: verify
        continue-on-error: true
        env:
          IRIS_RELEASE_UPLOAD_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
          WORKFLOW_REPORT_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
          IRIS_INTERNAL_VERSION: ${{ steps.meta.outputs.internal_version }}
          IRIS_SHELL_VERDICT_FILE: ${{ runner.temp }}/shell-gate-verdict
        run: node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh verify-shell-compatibility
      - name: Apply shell gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          IRIS_AUTO_SHELL_BUILD: 'true'
          IRIS_SHELL_GATE_OUTCOME: ${{ steps.verify.outcome }}
          IRIS_SHELL_VERDICT_FILE: ${{ runner.temp }}/shell-gate-verdict
        run: |
          bash .github/scripts/release-step.sh shell-gate
          if grep -q '^shell_build=true$' "$GITHUB_OUTPUT"; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
              -f event_type=iris-build \
              -f 'client_payload[build_kind]=shell' \
              -f "client_payload[source_sha]=$IRIS_SOURCE_SHA"
          fi
      - name: Reserve core version
        id: number
        if: steps.gate.outputs.shell_build != 'true'
        env:
          IRIS_RELEASE_UPLOAD_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
          WORKFLOW_REPORT_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
        run: |
          node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh core-build-number
      - name: Typecheck and build main
        if: steps.gate.outputs.shell_build != 'true'
        env:
          WORKFLOW_REPORT_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
        run: |
          node .github/scripts/run-quiet.mjs -- bash -c 'pnpm run typecheck:renderer && pnpm run build:main'
      - name: Run release static contract check
        if: steps.gate.outputs.shell_build != 'true'
        env:
          WORKFLOW_REPORT_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
        run: node .github/scripts/run-quiet.mjs -- pnpm run test:release-static
      - name: Run release behavior gate
        if: steps.gate.outputs.shell_build != 'true'
        env:
          WORKFLOW_REPORT_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
        run: node .github/scripts/run-quiet.mjs -- xvfb-run -a pnpm run test:release-behavior
      - name: Generate core release key
        if: steps.gate.outputs.shell_build != 'true'
        env:
          WORKFLOW_REPORT_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
        run: node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh generate-core-key
      - name: Download verified notification readers
        if: steps.gate.outputs.shell_build != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: notification-reader-*
          path: build/native/notification-reader/incoming
      - name: Pack core payload
        if: steps.gate.outputs.shell_build != 'true'
        env:
          IRIS_INTERNAL_VERSION: ${{ steps.meta.outputs.internal_version }}
          IRIS_CORE_BUILD: ${{ steps.number.outputs.core_build }}
          IRIS_CORE_VERSION: ${{ steps.number.outputs.core_version }}
          IRIS_RELEASE_UPLOAD_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
          WORKFLOW_REPORT_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
          IRIS_BUILD_CHANNEL: release
          NODE_OPTIONS: --max-old-space-size=4096
          IRIS_NOTIFICATION_READER_ASSET_DIRS_JSON: >-
            ["build/native/notification-reader/incoming/notification-reader-macos","build/native/notification-reader/incoming/notification-reader-windows","build/native/notification-reader/incoming/notification-reader-linux-x64","build/native/notification-reader/incoming/notification-reader-linux-arm64"]
        run: node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh pack-payload
      - name: Publish core payload
        if: steps.gate.outputs.shell_build != 'true'
        env:
          IRIS_INTERNAL_VERSION: ${{ steps.meta.outputs.internal_version }}
          IRIS_RELEASE_UPLOAD_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
          WORKFLOW_REPORT_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
        run: node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh upload-payload with-key
      - name: Checkout source for core tag
        if: steps.gate.outputs.shell_build != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: lsy-404/IRIS
          ref: ${{ env.IRIS_SOURCE_SHA }}
          path: tag-source
          ssh-key: ${{ secrets.IRIS_TAG_DEPLOY_KEY }}
          persist-credentials: true
      - name: Tag published core source
        if: steps.gate.outputs.shell_build != 'true'
        working-directory: tag-source
        run: bash .github/scripts/tag-build-commit.sh "core-v${{ steps.number.outputs.core_version }}"
      - name: Stage core release assets
        if: steps.gate.outputs.shell_build != 'true'
        run: mkdir -p release-assets && cp build/secure-payload/payload.irp build/secure-payload/ui.irp electron/dist/build-info.json release-assets/
      - name: Publish latest GitHub Release
        if: steps.gate.outputs.shell_build != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title latest --notes '' --latest
          gh release edit latest --title latest --notes '' --latest
          for asset in payload.irp ui.irp; do gh release delete-asset latest "$asset" --yes >/dev/null 2>&1 || true; done
          gh release upload latest release-assets/* --clobber
          tag_state="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq '[.name,.tag_name,(.body // ""),.draft,.prerelease,.id] | @tsv')"
          latest_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .id)"
          [[ "$tag_state" == *$'latest\tlatest\t\tfalse\tfalse\t'* && "$tag_state" == *$'\t'"$latest_id" ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq '[.assets[] | select(.state != "uploaded")] | length')" = 0
      - name: Wipe secrets and source
        if: always()
        run: rm -rf "$RUNNER_TEMP/iris-release-key" "$RUNNER_TEMP/iris-release-envelope" iris-source tag-source release-assets build

  shell-check:
    timeout-minutes: 30
    needs: [release-gate, notification-readers]
    permissions:
      actions: read
      contents: read
    if: needs.release-gate.outputs.build == 'true' && ((github.event_name == 'repository_dispatch' && github.event.action == 'iris-build' && github.event.client_payload.build_kind == 'shell') || (github.event_name == 'workflow_dispatch' && inputs.kind == 'shell'))
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ env.IRIS_SOURCE_SHA }}
      shell_version: ${{ steps.prepare.outputs.shell_version }}
      release_envelope: ${{ steps.key.outputs.envelope }}
      release_id: ${{ steps.key.outputs.release_id }}
      internal_version: ${{ steps.prepare.outputs.internal_version }}
      shell_fingerprint: ${{ steps.prepare.outputs.shell_fingerprint }}
      core_build: ${{ steps.prepare.outputs.core_build }}
      core_version: ${{ steps.prepare.outputs.core_version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate inputs and secrets
        env:
          IRIS_BUILD_DEPLOY_KEY: ${{ secrets.IRIS_BUILD_DEPLOY_KEY }}
          IRIS_TAG_DEPLOY_KEY: ${{ secrets.IRIS_TAG_DEPLOY_KEY }}
          IRIS_RELEASE_UPLOAD_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
          IRIS_RELEASE_KEY_TRANSFER_KEY: ${{ secrets.IRIS_RELEASE_KEY_TRANSFER_KEY }}
          IRIS_CONTEXT_SEAL_KEY: ${{ secrets.IRIS_CONTEXT_SEAL_KEY }}
        run: |
          [[ "$IRIS_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          [[ -n "$IRIS_BUILD_DEPLOY_KEY" && -n "$IRIS_TAG_DEPLOY_KEY" && -n "$IRIS_RELEASE_UPLOAD_TOKEN" && -n "$IRIS_RELEASE_KEY_TRANSFER_KEY" && "${#IRIS_CONTEXT_SEAL_KEY}" -ge 32 ]] || { echo 'required secrets are missing' >&2; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: lsy-404/IRIS
          ref: ${{ env.IRIS_SOURCE_SHA }}
          path: iris-source
          ssh-key: ${{ secrets.IRIS_BUILD_DEPLOY_KEY }}
          persist-credentials: false
      - name: Use source scripts
        run: |
          shopt -s dotglob nullglob
          for entry in iris-source/*; do
            [[ "$entry" == "iris-source/.git" ]] && continue
            cp -R "$entry" ./
          done
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pnpm
        run: |
          npm install --global --force corepack@0.34.1
          corepack enable pnpm
          corepack prepare pnpm@10.34.6 --activate
      - name: Checkout release tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - name: Prepare release and core payload
        id: prepare
        env:
          IRIS_RELEASE_UPLOAD_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
          IRIS_RELEASE_KEY_TRANSFER_KEY: ${{ secrets.IRIS_RELEASE_KEY_TRANSFER_KEY }}
          IRIS_SHELL_VERSION_INPUT: ${{ github.event.client_payload.shell_version || inputs.shell_version }}
          WORKFLOW_REPORT_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
          IRIS_BUILD_CHANNEL: release
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh install
          node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh resolve-version
          node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh metadata
          node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh shell-fingerprint
          node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh core-build-number
          node .github/scripts/run-quiet.mjs -- bash -c 'pnpm run typecheck:renderer && pnpm run build:main'
      - name: Run release static contract check
        env:
          WORKFLOW_REPORT_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
        run: node .github/scripts/run-quiet.mjs -- pnpm run test:release-static
      - name: Run release behavior gate
        env:
          WORKFLOW_REPORT_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
        run: node .github/scripts/run-quiet.mjs -- xvfb-run -a pnpm run test:release-behavior
      - name: Generate release key
        id: key
        env:
          IRIS_RELEASE_KEY_TRANSFER_KEY: ${{ secrets.IRIS_RELEASE_KEY_TRANSFER_KEY }}
          WORKFLOW_REPORT_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
        run: |
          node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh generate-key
      - name: Download verified notification readers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: notification-reader-*
          path: build/native/notification-reader/incoming
      - name: Decrypt and pack core payload
        env:
          IRIS_RELEASE_KEY_TRANSFER_KEY: ${{ secrets.IRIS_RELEASE_KEY_TRANSFER_KEY }}
          IRIS_RELEASE_KEY_ENVELOPE: ${{ steps.key.outputs.envelope }}
          IRIS_RELEASE_ID: ${{ steps.key.outputs.release_id }}
          IRIS_CORE_BUILD: ${{ steps.prepare.outputs.core_build }}
          IRIS_CORE_VERSION: ${{ steps.prepare.outputs.core_version }}
          IRIS_INTERNAL_VERSION: ${{ steps.prepare.outputs.internal_version }}
          WORKFLOW_REPORT_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
          IRIS_NOTIFICATION_READER_ASSET_DIRS_JSON: >-
            ["build/native/notification-reader/incoming/notification-reader-macos","build/native/notification-reader/incoming/notification-reader-windows","build/native/notification-reader/incoming/notification-reader-linux-x64","build/native/notification-reader/incoming/notification-reader-linux-arm64"]
          NODE_OPTIONS: --max-old-space-size=4096
          IRIS_BUILD_CHANNEL: release
        run: |
          node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh decrypt-key
          node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh pack-payload
      - name: Publish core payload to next job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-payload
          path: |
            build/secure-payload/payload.irp
            build/secure-payload/ui.irp
            electron/dist/build-info.json
          if-no-files-found: error
          retention-days: 1
      - name: Wipe shell-check workspace
        if: always()
        run: rm -rf "$RUNNER_TEMP/iris-release-key" "$RUNNER_TEMP/iris-release-envelope" iris-source build

  shell-build:
    needs: shell-check
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist_cmd: pnpm run dist:win --publish never
          - os: ubuntu-latest
            dist_cmd: pnpm run dist:linux --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: lsy-404/IRIS
          ref: ${{ needs.shell-check.outputs.source_sha }}
          path: iris-source
          ssh-key: ${{ secrets.IRIS_BUILD_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0
      - run: |
          shopt -s dotglob nullglob
          for entry in iris-source/*; do
            [[ "$entry" == "iris-source/.git" ]] && continue
            cp -R "$entry" ./
          done
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pnpm
        run: |
          npm install --global --force corepack@0.34.1
          corepack enable pnpm
          corepack prepare pnpm@10.34.6 --activate
      - name: Download verified notification readers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: notification-reader-*
          path: build/native/notification-reader/incoming
      - name: Build installer
        env:
          npm_config_node_gyp: ${{ github.workspace }}/node_modules/node-gyp/bin/node-gyp.js
          IRIS_SHELL_VERSION: ${{ needs.shell-check.outputs.shell_version }}
          IRIS_RELEASE_KEY_TRANSFER_KEY: ${{ secrets.IRIS_RELEASE_KEY_TRANSFER_KEY }}
          IRIS_RELEASE_KEY_ENVELOPE: ${{ needs.shell-check.outputs.release_envelope }}
          IRIS_RELEASE_ID: ${{ needs.shell-check.outputs.release_id }}
          IRIS_CORE_BUILD: ${{ needs.shell-check.outputs.core_build }}
          IRIS_CORE_VERSION: ${{ needs.shell-check.outputs.core_version }}
          IRIS_INTERNAL_VERSION: ${{ needs.shell-check.outputs.internal_version }}
          IRIS_LICENSE_BUILD_API_ORIGIN: https://iris.voidcarve.com
          IRIS_RELEASE_UPLOAD_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
          DIST_CMD: ${{ matrix.dist_cmd }}
          EP_PREPACKAGED: ''
          NODE_OPTIONS: --max-old-space-size=4096
          WORKFLOW_REPORT_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
          IRIS_NOTIFICATION_READER_ASSET_DIRS_JSON: >-
            ["build/native/notification-reader/incoming/notification-reader-macos","build/native/notification-reader/incoming/notification-reader-windows","build/native/notification-reader/incoming/notification-reader-linux-x64","build/native/notification-reader/incoming/notification-reader-linux-arm64"]
        run: |
          node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh apply-version
          node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh install
          node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh decrypt-key
          node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh build
          node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh stage-installers
          cp release/latest*.yml staged-installers/ 2>/dev/null || true
      - name: Retain staged installers for failed-build diagnosis
        if: always() && hashFiles('staged-installers/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installers-${{ matrix.os }}
          path: staged-installers
          if-no-files-found: error
          retention-days: 3
      - name: Wipe build workspace
        if: always()
        run: rm -rf "$RUNNER_TEMP/iris-release-key" "$RUNNER_TEMP/iris-release-envelope" iris-source staged-installers build

  shell-build-macos:
    needs: [shell-check, shell-build]
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Reject workflow reruns
        if: ${{ github.run_attempt != 1 }}
        run: exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Checkout release tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: lsy-404/IRIS
          ref: ${{ needs.shell-check.outputs.source_sha }}
          path: iris-source
          ssh-key: ${{ secrets.IRIS_BUILD_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0
      - run: |
          shopt -s dotglob nullglob
          for entry in iris-source/*; do
            [[ "$entry" == "iris-source/.git" ]] && continue
            cp -R "$entry" ./
          done
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pnpm
        run: |
          npm install --global --force corepack@0.34.1
          corepack enable pnpm
          corepack prepare pnpm@10.34.6 --activate
      - name: Download verified notification readers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: notification-reader-*
          path: build/native/notification-reader/incoming
      - name: Build installer
        env:
          npm_config_node_gyp: ${{ github.workspace }}/node_modules/node-gyp/bin/node-gyp.js
          IRIS_SHELL_VERSION: ${{ needs.shell-check.outputs.shell_version }}
          IRIS_RELEASE_KEY_TRANSFER_KEY: ${{ secrets.IRIS_RELEASE_KEY_TRANSFER_KEY }}
          IRIS_RELEASE_KEY_ENVELOPE: ${{ needs.shell-check.outputs.release_envelope }}
          IRIS_RELEASE_ID: ${{ needs.shell-check.outputs.release_id }}
          IRIS_CORE_BUILD: ${{ needs.shell-check.outputs.core_build }}
          IRIS_CORE_VERSION: ${{ needs.shell-check.outputs.core_version }}
          IRIS_INTERNAL_VERSION: ${{ needs.shell-check.outputs.internal_version }}
          IRIS_LICENSE_BUILD_API_ORIGIN: https://iris.voidcarve.com
          IRIS_RELEASE_UPLOAD_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
          DIST_CMD: pnpm run dist:mac --publish never
          EP_PREPACKAGED: ''
          NODE_OPTIONS: --max-old-space-size=4096
          WORKFLOW_REPORT_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
          IRIS_NOTIFICATION_READER_ASSET_DIRS_JSON: >-
            ["build/native/notification-reader/incoming/notification-reader-macos","build/native/notification-reader/incoming/notification-reader-windows","build/native/notification-reader/incoming/notification-reader-linux-x64","build/native/notification-reader/incoming/notification-reader-linux-arm64"]
        run: |
          node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh apply-version
          node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh install
          node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh decrypt-key
          node .github/scripts/run-quiet.mjs -- bash .github/scripts/release-step.sh build
      - name: Prepare macOS signing sources
        id: prepare
        env:
          INPUT_VERSION: ${{ needs.shell-check.outputs.shell_version }}
          INPUT_SOURCE_SHA: ${{ needs.shell-check.outputs.source_sha }}
        run: node .release-tools/scripts/submit-macos.mjs prepare
      - name: Submit arm64 for signing
        id: arm64
        env:
          SIGNING_API_KEY: ${{ secrets.SIGNING_API_KEY }}
          INPUT_ARCH: arm64
          INPUT_WORK_DIR: ${{ steps.prepare.outputs.arm64_work_dir }}
          INPUT_VERSION: ${{ needs.shell-check.outputs.shell_version }}
          INPUT_SOURCE_SHA: ${{ needs.shell-check.outputs.source_sha }}
        run: node .release-tools/scripts/submit-macos.mjs submit
      - name: Submit x64 for signing
        id: x64
        env:
          SIGNING_API_KEY: ${{ secrets.SIGNING_API_KEY }}
          INPUT_ARCH: x64
          INPUT_WORK_DIR: ${{ steps.prepare.outputs.x64_work_dir }}
          INPUT_VERSION: ${{ needs.shell-check.outputs.shell_version }}
          INPUT_SOURCE_SHA: ${{ needs.shell-check.outputs.source_sha }}
        run: node .release-tools/scripts/submit-macos.mjs submit
      - name: Record shell release context
        id: context
        env:
          IRIS_CONTEXT_SEAL_KEY: ${{ secrets.IRIS_CONTEXT_SEAL_KEY }}
          INPUT_SOURCE_SHA: ${{ needs.shell-check.outputs.source_sha }}
          INPUT_SHELL_VERSION: ${{ needs.shell-check.outputs.shell_version }}
          INPUT_INTERNAL_VERSION: ${{ needs.shell-check.outputs.internal_version }}
          INPUT_CORE_BUILD: ${{ needs.shell-check.outputs.core_build }}
          INPUT_CORE_VERSION: ${{ needs.shell-check.outputs.core_version }}
          INPUT_SHELL_FINGERPRINT: ${{ needs.shell-check.outputs.shell_fingerprint }}
          INPUT_RELEASE_ID: ${{ needs.shell-check.outputs.release_id }}
          INPUT_RELEASE_ENVELOPE: ${{ needs.shell-check.outputs.release_envelope }}
          INPUT_ARM64_REQUEST_ID: ${{ steps.arm64.outputs.request_id }}
          INPUT_ARM64_INPUT_DIGEST: ${{ steps.arm64.outputs.input_digest }}
          INPUT_ARM64_INPUT_SIZE: ${{ steps.arm64.outputs.input_size }}
          INPUT_X64_REQUEST_ID: ${{ steps.x64.outputs.request_id }}
          INPUT_X64_INPUT_DIGEST: ${{ steps.x64.outputs.input_digest }}
          INPUT_X64_INPUT_SIZE: ${{ steps.x64.outputs.input_size }}
        run: node .release-tools/scripts/submit-macos.mjs context
      - name: Hand the release to the publish workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shell-release-context
          path: ${{ steps.context.outputs.path }}
          if-no-files-found: error
          retention-days: 3
      - name: Remove signing sources
        if: always() && (steps.prepare.outputs.arm64_work_dir != '' || steps.prepare.outputs.x64_work_dir != '')
        env:
          INPUT_WORK_DIRS: ${{ steps.prepare.outputs.arm64_work_dir }} ${{ steps.prepare.outputs.x64_work_dir }}
        run: node .release-tools/scripts/submit-macos.mjs cleanup
      - name: Wipe build workspace
        if: always()
        run: rm -rf "$RUNNER_TEMP/iris-release-key" "$RUNNER_TEMP/iris-release-envelope" "$RUNNER_TEMP/shell-release-context" iris-source build release

  notification-readers:
    needs: release-gate
    if: needs.release-gate.outputs.build == 'true' && ((github.event_name == 'repository_dispatch' && github.event.action == 'iris-build' && (github.event.client_payload.build_kind == 'core' || github.event.client_payload.build_kind == 'shell')) || (github.event_name == 'workflow_dispatch' && (inputs.kind == 'core' || inputs.kind == 'shell')))
    env:
      WORKFLOW_REPORT_TOKEN: ${{ secrets.IRIS_RELEASE_UPLOAD_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-14
            target: ''
          - platform: windows
            runner: windows-latest
            target: ''
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: iris-source
        shell: bash
    steps:
      - name: Checkout trusted build tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - name: Validate source commit
        working-directory: .
        run: '[[ "$IRIS_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "source_sha must be a 40-character commit SHA" >&2; exit 1; }'
      - name: Checkout exact private source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: lsy-404/IRIS
          ref: ${{ env.IRIS_SOURCE_SHA }}
          path: iris-source
          ssh-key: ${{ secrets.IRIS_BUILD_DEPLOY_KEY }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: Setup Rust
        if: runner.os != 'macOS'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Linux Rust target
        if: runner.os == 'Linux'
        run: rustup target add '${{ matrix.target }}' --toolchain stable
      - name: Install static Linux C linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Verify the native protocol
        if: runner.os != 'macOS'
        run: node ../.release-tools/scripts/ci-quiet.mjs -- cargo test --locked --manifest-path native/notification-reader/Cargo.toml
      - name: Build notification readers
        run: node ../.release-tools/scripts/ci-quiet.mjs -- node scripts/native-notification-reader.mjs build
      - name: Verify source digest
        run: node ../.release-tools/scripts/ci-quiet.mjs -- node scripts/native-notification-reader.mjs digest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notification-reader-${{ matrix.platform }}
          path: iris-source/build/native/notification-reader
          include-hidden-files: true
          retention-days: 1
